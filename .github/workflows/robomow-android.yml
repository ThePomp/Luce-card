name: Robomow Android

on:
  push:
    paths:
      - "robomow-android/**"
      - ".github/workflows/robomow-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robomow-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test protocollo
        run: ./gradlew --no-daemon :protocol:test

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk robomow-luce.apk

      - uses: actions/upload-artifact@v4
        with:
          name: robomow-luce-apk
          path: robomow-android/robomow-luce.apk

      - name: Pubblica nella release "robomow-app-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: robomow-app-latest
          name: Robomow Luce (app Android, anteprima)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Ultima versione dell'app Android per Robomow (build ${{ github.run_number }}, commit ${{ github.sha }}).
            Scarica `robomow-luce.apk` dal telefono e installala (consenti "installa app sconosciute").
          files: robomow-android/robomow-luce.apk
